[project]
name = "humanfallback"
version = "0.3.0"
description = "Agent-to-human delegation layer built around Gibwork."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
hf = "humanfallback.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humanfallback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
